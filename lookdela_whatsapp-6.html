<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LookDela | WhatsApp</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:24px;font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(145deg,#fff7fa,#f8edf3);color:#30272c
}
.card{
 width:min(420px,100%);text-align:center;background:#fff;
 border:1px solid #f0dfe6;border-radius:28px;padding:38px 24px 30px;
 box-shadow:0 18px 50px rgba(80,45,60,.12)
}
.logo{
 width:82px;height:82px;border-radius:50%;margin:0 auto 18px;
 display:flex;align-items:center;justify-content:center;
 background:#f5dbe5;font-size:40px
}
h1{margin:0 0 10px;font-size:29px}
p{margin:0 auto 25px;line-height:1.55;color:#6d6267}
.btn{
 display:block;text-decoration:none;background:#25D366;color:white;
 padding:17px 20px;border-radius:16px;font-weight:700;font-size:17px;
 box-shadow:0 8px 20px rgba(37,211,102,.22)
}
.small{font-size:12px;margin-top:18px;color:#9a8d93}
</style>
</head>
<body>
<main class="card">
  <div class="logo">♡</div>
  <h1>LookDela</h1>
  <p>Looks femininos, tendências, inspirações e achadinhos. 💕<br>
  Entre no nosso canal do WhatsApp para acompanhar tudo!</p>
  <a class="btn" href="https://whatsapp.com/channel/0029Vb9DkLp4tRrxfRGweS11">
    💬 Entrar no canal do WhatsApp
  </a>
  <div class="small">Moda • Estilo • Inspiração • Achadinhos</div>
</main>
</body>
</html>
